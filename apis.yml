aid: endurosat
name: EnduroSat
description: 'EnduroSat is a Sofia, Bulgaria-based satellite manufacturer and space
  service provider working to make space universally accessible by lowering the cost
  and complexity of accessing space data. The company builds CubeSat and SmallSat
  platforms (FRAME Max, FRAME L, FRAME S buses and 8U/12U/16U CubeSats), avionics
  and communication modules (X-Band SDR, S-Band and UHF transceivers, EPS power modules,
  solar panels, and antennas), and delivers end-to-end Space Service, SpaceOps, and
  SpaceDev offerings that take customers from idea to orbit in roughly six months.
  EnduroSat has deployed 100+ satellites with 3,500+ modules in operation, downlinked
  500+ TB of data, and serves ~450 customers including NASA, ESA, and IBM Space. It
  maintains an open-source GitHub organization publishing Cubesat Space Protocol (CSP)
  implementations and NextGen ground-station and onboard API frameworks. Backed by
  Founders Fund and GV.'
